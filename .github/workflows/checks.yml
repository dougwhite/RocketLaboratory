name: Toolkit checks
on: [push, pull_request]
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check-public-tree.py
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: rocketlab doctor
  portable-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/native
      - run: ctest --test-dir build/native --output-on-failure
